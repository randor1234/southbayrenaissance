<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks &middot; South Bay Renaissance</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --cream:#FBF1DD; --cream-2:#F4E7CE; --paper:#FFFAF0;
  --ink:#1B1A18; --ink-2:#5E5851; --line:#E2D2B6;
  --orange:#E4552A; --orange-2:#EE6A1E; --amber:#F5A61E;
  --band:#1B1A18; --band-ink:#FBF1DD; --band-ink-2:#B7ABA0; --band-line:#3A3733;
  --shadow:0 1px 2px rgba(27,26,24,.06), 0 10px 28px -14px rgba(27,26,24,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#15120E; --cream-2:#1D1913; --paper:#1A1610;
    --ink:#F7EDDC; --ink-2:#B0A594; --line:#332C22;
    --orange:#F2703F; --orange-2:#F5823A; --amber:#F6B33F;
    --band:#0E0C09; --band-ink:#F7EDDC; --band-ink-2:#A2988A; --band-line:#2C271F;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --cream:#15120E; --cream-2:#1D1913; --paper:#1A1610;
  --ink:#F7EDDC; --ink-2:#B0A594; --line:#332C22;
  --orange:#F2703F; --orange-2:#F5823A; --amber:#F6B33F;
  --band:#0E0C09; --band-ink:#F7EDDC; --band-ink-2:#A2988A; --band-line:#2C271F;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family:"Work Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:17px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:"Oswald", "Arial Narrow", Impact, sans-serif; margin:0; font-weight:700;
  line-height:1.02; letter-spacing:.005em; text-transform:uppercase; text-wrap:balance;
}
p{margin:0}
a{color:inherit}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px}
.stack{display:flex; flex-direction:column}
.eyebrow{
  font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:.71rem; letter-spacing:.18em; text-transform:uppercase; font-weight:500;
}
.lede{font-size:1.1rem; color:var(--ink-2); max-width:62ch}

/* ---------- nav ---------- */
.nav{position:sticky; top:0; z-index:60; background:color-mix(in srgb, var(--cream) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.nav-in{display:flex; align-items:center; gap:26px; height:62px}
.mark{display:flex; align-items:baseline; gap:7px; text-decoration:none; font-family:"Oswald",sans-serif; text-transform:uppercase; letter-spacing:.01em; font-size:1.06rem; line-height:1}
.mark .a{color:var(--orange); font-weight:600}
.mark .b{color:var(--ink); font-weight:700}
.nav-links{display:flex; gap:24px; margin-left:auto; align-items:center}
.nav-links a{text-decoration:none; font-size:.9rem; color:var(--ink-2); font-weight:500}
.nav-links a:hover{color:var(--ink)}
.nav-cta{
  font-family:"Oswald",sans-serif; text-transform:uppercase; letter-spacing:.04em;
  background:var(--orange); color:#fff !important; padding:9px 17px; font-weight:600; font-size:.85rem; white-space:nowrap;
}
@media (max-width:900px){ .nav-links a.hide-sm{display:none} }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px; text-decoration:none;
  font-family:"Oswald",sans-serif; text-transform:uppercase; letter-spacing:.05em; font-weight:600;
  font-size:.95rem; padding:14px 26px; border:2px solid transparent; transition:transform .15s ease, background .15s ease, color .15s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--orange); color:#fff}
.btn-primary:hover{background:var(--orange-2)}
.btn-outline{border-color:var(--ink); color:var(--ink)}
.btn-outline:hover{background:var(--ink); color:var(--cream)}
.btn-on-dark{border-color:var(--band-ink); color:var(--band-ink)}
.btn-on-dark:hover{background:var(--band-ink); color:var(--band)}

/* ---------- hero ---------- */
.hero{position:relative; overflow:hidden; background:var(--cream); border-bottom:1px solid var(--line)}
.hero-in{position:relative; z-index:2; display:grid; grid-template-columns:1.25fr .75fr; gap:48px; align-items:center; padding:76px 0 84px}
.hero .eyebrow{color:var(--orange)}
.hero h1{font-size:clamp(3rem, 8.6vw, 6.6rem); margin:18px 0 0; letter-spacing:-.005em}
.hero h1 .l2{display:block; color:var(--orange)}
.hero-sub{margin-top:24px; max-width:54ch; font-size:1.12rem; color:var(--ink-2)}
.hero-cta{display:flex; flex-wrap:wrap; gap:12px; margin-top:32px}
.sunart{width:100%; height:auto; display:block}
@media (max-width:900px){ .hero-in{grid-template-columns:1fr; gap:30px; padding:56px 0 64px} .sunart{max-width:340px} }

/* ---------- section frame ---------- */
section{padding:88px 0}
.alt{background:var(--paper); border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.sec-head{display:flex; flex-direction:column; gap:14px; margin-bottom:46px}
.sec-head .eyebrow{color:var(--orange)}
.sec-head h2{font-size:clamp(2rem, 4.4vw, 3.2rem); max-width:22ch}

/* ---------- mission ---------- */
.mission-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:56px; align-items:start}
@media (max-width:900px){ .mission-grid{grid-template-columns:1fr; gap:34px} }
.mission-grid p + p{margin-top:18px}
.pull{
  background:var(--band); color:var(--band-ink); padding:32px; position:relative;
}
.pull q{font-family:"Oswald",sans-serif; font-size:1.5rem; line-height:1.22; font-weight:500; quotes:none; display:block}
.pull cite{display:block; font-family:"IBM Plex Mono",monospace; font-style:normal; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--band-ink-2); margin-top:20px}
.pull cite a{color:var(--amber); text-decoration:none}
.pull cite a:hover{text-decoration:underline}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:26px}
.stat{border-top:3px solid var(--orange); padding-top:12px}
.stat .n{font-family:"Oswald",sans-serif; font-size:1.9rem; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
.stat .l{font-size:.84rem; color:var(--ink-2); margin-top:6px}

/* ---------- calendar ---------- */
.cal{display:flex; flex-direction:column; border-top:2px solid var(--ink)}
.ev{
  display:grid; grid-template-columns:96px 1fr auto; gap:28px; align-items:center;
  padding:26px 4px; border-bottom:1px solid var(--line);
}
.ev.open{background:linear-gradient(90deg, color-mix(in srgb, var(--amber) 16%, transparent), transparent 62%)}
.dchip{text-align:center; font-variant-numeric:tabular-nums; border-right:1px solid var(--line); padding-right:20px}
.dchip .mo{font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--orange)}
.dchip .dy{font-family:"Oswald",sans-serif; font-size:2.5rem; font-weight:700; line-height:1; display:block}
.dchip .wd{font-size:.76rem; color:var(--ink-2); letter-spacing:.06em; text-transform:uppercase}
.dchip.tba .dy{font-size:1.15rem; padding:12px 0; color:var(--ink-2)}
.ev h3{font-size:1.32rem; letter-spacing:.01em}
.ev .meta{color:var(--ink-2); font-size:.94rem; margin-top:5px}
.ev .desc{color:var(--ink-2); font-size:.94rem; margin-top:8px; max-width:64ch}
.badge{
  display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.66rem; letter-spacing:.14em;
  text-transform:uppercase; padding:4px 9px; border:1px solid var(--line); color:var(--ink-2); margin-bottom:8px;
}
.badge.live{background:var(--orange); border-color:var(--orange); color:#fff}
@media (max-width:820px){
  .ev{grid-template-columns:72px 1fr; gap:18px}
  .ev .btn{grid-column:1 / -1; width:100%}
  .dchip{padding-right:14px}
  .dchip .dy{font-size:2rem}
}
.cal-foot{margin-top:28px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between}
.cal-foot p{font-size:.94rem; color:var(--ink-2)}

/* ---------- submit steps ---------- */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:2px; background:var(--line)}
@media (max-width:900px){ .steps{grid-template-columns:1fr} }
.step{background:var(--cream); padding:28px 24px; display:flex; flex-direction:column; gap:10px}
.alt .step{background:var(--paper)}
.step .num{font-family:"Oswald",sans-serif; font-size:2.6rem; font-weight:700; line-height:.9; color:var(--orange); font-variant-numeric:tabular-nums}
.step h3{font-size:1.06rem}
.step p{font-size:.94rem; color:var(--ink-2)}
.submit-cta{margin-top:34px; display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.submit-cta .note{font-size:.92rem; color:var(--ink-2); max-width:44ch}

/* ---------- commons ---------- */
.res{display:grid; grid-template-columns:repeat(5,1fr); gap:18px}
@media (max-width:1000px){ .res{grid-template-columns:repeat(2,1fr)} }
@media (max-width:540px){ .res{grid-template-columns:1fr} }
.res-card{background:var(--cream); border:1px solid var(--line); padding:22px; display:flex; flex-direction:column; gap:10px}
.alt .res-card{background:var(--paper)}
.res-card svg{width:26px; height:26px; color:var(--orange)}
.res-card h3{font-size:1rem}
.res-card p{font-size:.89rem; color:var(--ink-2)}

/* ---------- communities ---------- */
.two{display:grid; grid-template-columns:1fr 1fr; gap:48px}
@media (max-width:820px){ .two{grid-template-columns:1fr; gap:32px} }
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.chip{font-size:.87rem; padding:6px 13px; border:1px solid var(--line); color:var(--ink-2); background:var(--cream)}
.alt .chip{background:var(--paper)}
.chip.on{border-color:var(--orange); color:var(--orange); font-weight:600}
.sub-note{margin-top:26px; font-size:.93rem; color:var(--ink-2); max-width:70ch}

/* ---------- about ---------- */
.about{background:var(--band); color:var(--band-ink)}
.about .sec-head .eyebrow{color:var(--amber)}
.about .lede{color:var(--band-ink-2)}
.values{display:grid; grid-template-columns:repeat(3,1fr); gap:0 44px}
@media (max-width:900px){ .values{grid-template-columns:1fr} }
.value{padding:24px 0; border-top:1px solid var(--band-line)}
.value h3{font-size:1.02rem; color:var(--band-ink); margin-bottom:7px}
.value p{font-size:.93rem; color:var(--band-ink-2)}
.photos{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:52px}
@media (max-width:820px){ .photos{grid-template-columns:repeat(2,1fr)} }
.ph{
  aspect-ratio:4/3; border:1px dashed var(--band-line); display:flex; align-items:center; justify-content:center;
  text-align:center; padding:16px; color:var(--band-ink-2); font-family:"IBM Plex Mono",monospace;
  font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; line-height:1.7;
  background:repeating-linear-gradient(135deg, transparent, transparent 9px, color-mix(in srgb, var(--band-ink) 4%, transparent) 9px, color-mix(in srgb, var(--band-ink) 4%, transparent) 18px);
}
.photos-note{margin-top:18px; font-size:.92rem; color:var(--band-ink-2)}
.photos-note strong{color:var(--amber); font-weight:600}

/* ---------- get involved ---------- */
.ways{display:grid; grid-template-columns:repeat(2,1fr); gap:18px}
@media (max-width:760px){ .ways{grid-template-columns:1fr} }
.way{
  background:var(--cream); border:1px solid var(--line); padding:26px; text-decoration:none;
  display:flex; flex-direction:column; gap:9px; transition:border-color .15s ease, transform .15s ease;
}
.alt .way{background:var(--paper)}
.way:hover{border-color:var(--orange); transform:translateY(-2px)}
.way h3{font-size:1.08rem}
.way p{font-size:.95rem; color:var(--ink-2)}
.way .go{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); margin-top:4px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line); padding:44px 0 56px; background:var(--cream)}
.foot{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-start; justify-content:space-between}
.tag{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--orange); letter-spacing:.08em; margin-top:8px; display:block}
.foot .links{display:flex; gap:22px; font-size:.92rem; flex-wrap:wrap}
.foot a{color:var(--ink-2); text-decoration:none}
.foot a:hover{color:var(--ink)}
.fine{font-size:.82rem; color:var(--ink-2); width:100%; margin-top:8px}


/* ---------- tweet embed ---------- */
.tweetwrap{display:flex; flex-direction:column}
.twitter-tweet{
  margin:0; background:var(--band); color:var(--band-ink); padding:26px 28px;
  font-size:1rem; line-height:1.6; border-left:4px solid var(--orange);
}
.twitter-tweet p{margin:0 0 16px}
.twitter-tweet a{color:var(--amber); text-decoration:none}
.twitter-tweet a:hover{text-decoration:underline}
.twitter-tweet-rendered{background:none; padding:0; border-left:0}

/* ---------- group chat ---------- */
.btn-chat{background:var(--ink); color:var(--cream)}
.btn-chat:hover{background:var(--orange); color:#fff}
.hero .btn-chat{background:var(--amber); color:#1B1A18}
.hero .btn-chat:hover{background:var(--orange); color:#fff}
.btn-chat.lg{padding:18px 30px; font-size:1.05rem; white-space:nowrap}
.chatband{background:var(--band); color:var(--band-ink); padding:66px 0}
.chatband-in{display:grid; grid-template-columns:1fr auto; gap:44px; align-items:center}
.chatband .eyebrow{color:var(--amber)}
.chatband h2{font-size:clamp(1.7rem, 3.4vw, 2.5rem); margin:12px 0 14px; max-width:22ch; color:var(--band-ink)}
.chatband .lede{color:var(--band-ink-2); max-width:66ch}
.chatband .btn-chat{background:var(--amber); color:#1B1A18}
.chatband .btn-chat:hover{background:var(--orange); color:#fff}
@media (max-width:860px){ .chatband-in{grid-template-columns:1fr; gap:26px} .chatband .btn-chat.lg{width:100%} }
.way.wayfeat{border-color:var(--orange); border-width:2px}

/* ---------- interactive chips ---------- */
.chip{font-family:inherit; cursor:pointer; transition:border-color .12s ease, color .12s ease, transform .12s ease}
.chip:hover{border-color:var(--orange); color:var(--orange); transform:translateY(-1px)}
.chip:focus-visible{outline:3px solid var(--orange); outline-offset:2px}

/* ---------- way as button ---------- */
button.way{font-family:inherit; font-size:inherit; text-align:left; width:100%; cursor:pointer; color:inherit}

/* ---------- form ---------- */
.sbrform{
  margin-top:28px; background:var(--cream); border:1px solid var(--line); padding:30px;
  display:flex; flex-direction:column; gap:18px;
}
.alt .sbrform{background:var(--paper)}
.sbrform label{display:flex; flex-direction:column; gap:7px; font-size:.86rem; font-weight:600; color:var(--ink-2); letter-spacing:.02em}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media (max-width:700px){ .frow{grid-template-columns:1fr} }
.sbrform input[type=text], .sbrform input[type=email], .sbrform select, .sbrform textarea{
  font-family:inherit; font-size:1rem; font-weight:400; color:var(--ink);
  background:var(--surface, var(--paper)); border:1px solid var(--line); padding:12px 14px; border-radius:0;
  width:100%; transition:border-color .12s ease;
}
.alt .sbrform input[type=text], .alt .sbrform input[type=email], .alt .sbrform select, .alt .sbrform textarea{background:var(--cream)}
.sbrform textarea{resize:vertical; line-height:1.55}
.sbrform input:focus, .sbrform select:focus, .sbrform textarea:focus{outline:none; border-color:var(--orange); box-shadow:0 0 0 2px color-mix(in srgb, var(--orange) 25%, transparent)}
.fsend{display:flex; flex-wrap:wrap; align-items:center; gap:16px; margin-top:4px}
.fnote{font-size:.86rem; color:var(--ink-2)}
.hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
.sbrform.flash{animation:flash 1.1s ease}
@keyframes flash{0%,100%{border-color:var(--line)}25%,60%{border-color:var(--orange)}}
@media (prefers-reduced-motion: reduce){ .sbrform.flash{animation:none} }

a:focus-visible, .way:focus-visible{outline:3px solid var(--orange); outline-offset:3px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} .btn:hover,.way:hover{transform:none} }
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap nav-in">
    <a class="mark" href="/"><span class="a">South Bay</span><span class="b">Renaissance</span></a>
    <div class="nav-links">
      <a class="nav-cta" href="/">Back to the site</a>
    </div>
  </div>
</nav>
<section>
  <div class="wrap" style="max-width:640px">
    <p class="eyebrow" style="color:var(--orange)">Got it</p>
    <h2 style="font-size:clamp(2rem, 5vw, 3.2rem); margin:16px 0 20px">Thanks, we have your note.</h2>
    <p class="lede">Someone from the SBR team will come back to you within a day or two. If you have not already, the group chat is the fastest way to plug in.</p>
    <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:32px">
      <a class="btn btn-chat" href="https://join.tribechat.com/ro2rImXwS5" target="_blank" rel="noopener">Apply to join the group chat</a>
      <a class="btn btn-outline" href="/">Back to the site</a>
    </div>
  </div>
</section>
</body>
</html>
